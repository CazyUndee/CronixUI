name: Java CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/java/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Build with Maven
        working-directory: packages/java
        run: mvn compile -q

      - name: Run tests
        working-directory: packages/java
        run: mvn test -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Check style (compile with warnings as errors)
        working-directory: packages/java
        run: mvn compile -q 2>&1 | tee /tmp/build.log; if grep -i "error" /tmp/build.log; then exit 1; fi

      - name: Package
        working-directory: packages/java
        run: mvn package -q -DskipTests
