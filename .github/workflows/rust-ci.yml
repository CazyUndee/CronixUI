name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'packages/rust/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/rust/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust/cronixui/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Install system dependencies for egui
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libgtk-3-dev

      - name: Run cargo check
        working-directory: packages/rust/cronixui
        run: cargo check --verbose

      - name: Run cargo test
        working-directory: packages/rust/cronixui
        run: cargo test --verbose

      - name: Run clippy
        working-directory: packages/rust/cronixui
        run: cargo clippy -- -D warnings

      - name: Check formatting
        working-directory: packages/rust/cronixui
        run: cargo fmt -- --check

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust/cronixui/target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libgtk-3-dev

      - name: Build release
        working-directory: packages/rust/cronixui
        run: cargo build --release
