name: WinUI CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'packages/win/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/win/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Verify project structure
        run: |
          echo "Checking WinUI project files..."
          dir packages\win\CronixUI.WinUI\
          echo "Total controls:"
          (Get-ChildItem packages\win\CronixUI.WinUI\Controls\*.cs).Count

      - name: Build WinUI project (MSBuild)
        working-directory: packages/win/CronixUI.WinUI
        run: |
          msbuild CronixUI.WinUI.sln /restore /p:Configuration=Release /m

      - name: Verify build output
        run: |
          echo "Build completed successfully!"
          $dll = Get-ChildItem packages\win\CronixUI.WinUI\bin\Release -Recurse -Filter CronixUI.WinUI.dll | Select-Object -First 1
          if ($null -eq $dll) { throw "CronixUI.WinUI.dll not found in build output" }
          Write-Host "Found: $($dll.FullName)"
