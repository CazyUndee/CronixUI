name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/web/**'
      - 'packages/react/**'
      - 'packages/typescript/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build packages
        run: |
          cd packages/web && npm ci && npm run build
          cd ../react && npm ci && npm run build
          cd ../typescript && npm ci && npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
