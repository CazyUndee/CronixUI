name: TypeScript CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/typescript/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/typescript/**'
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package.json

      - name: Install dependencies
        working-directory: packages/typescript
        run: npm install

      - name: Build TypeScript
        working-directory: packages/typescript
        run: npm run build
