name: TypeScript CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'packages/typescript/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/typescript/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: packages/typescript
        run: npm ci || npm install

      - name: Build TypeScript
        working-directory: packages/typescript
        run: npm run build

      - name: Verify dist files exist
        run: |
          ls -la packages/typescript/dist/
          test -f packages/typescript/dist/index.js
          test -f packages/typescript/dist/index.d.ts
          test -f packages/typescript/dist/tokens.js
          test -f packages/typescript/dist/tokens.d.ts
          echo "All dist files present!"

      - name: Test import
        run: |
          node --input-type=module -e "
          import { COLORS, VERSION } from './packages/typescript/dist/tokens.js';
          console.log('Colors:', Object.keys(COLORS).length, 'tokens');
          console.log('Version:', VERSION);
          console.log('TypeScript package builds and imports correctly!');
          "
