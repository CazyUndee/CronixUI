name: Svelte CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/svelte/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/svelte/**'
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: packages/svelte/package.json

      - name: Install dependencies
        working-directory: packages/svelte
        run: npm install

      - name: Run Svelte-Check
        working-directory: packages/svelte
        run: npm run check
