name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/python/**'
      - 'tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/python/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          sudo apt-get install -y -qq python3-tk || true

      - name: Install Python package
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run token tests (no display needed)
        run: |
          python -m pytest tests/test_tokens.py -v

      - name: Run import tests
        run: |
          python -c "
          import cronixui
          print('Version:', cronixui.__version__)
          from cronixui import Button, ButtonGroup, Card, CardIcon, Modal, Toggle
          from cronixui import Input, Textarea, Checkbox, Radio, Select, Slider, FileInput
          from cronixui import Frame, Label, Entry, get_theme, set_theme
          print('All native tkinter components imported successfully!')
          "

      - name: Run full test suite
        run: |
          xvfb-run python -m pytest tests/ -v --tb=short || python -m pytest tests/ -v --tb=short -k "not xdisplay"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        working-directory: packages/python
        run: python -m build

      - name: Check package
        run: twine check packages/python/dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: packages/python/dist/
          retention-days: 7
