name: Go CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/go/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/go/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install system dependencies for Fyne
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev \
            libegl-dev \
            libgles-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libglu1-mesa-dev

      - name: Download dependencies
        working-directory: packages/go/cronixui
        run: go mod download

      - name: Verify module
        working-directory: packages/go/cronixui
        run: go mod verify

      - name: Run tests
        working-directory: packages/go/cronixui
        run: go test -v ./...

      - name: Build package
        working-directory: packages/go/cronixui
        run: go build -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install system dependencies for Fyne
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libx11-dev

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: packages/go/cronixui
          args: --timeout=5m

      - name: Run go vet
        working-directory: packages/go/cronixui
        run: go vet ./...
