name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'packages/flutter/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/flutter/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-version: ['3.19.x', '3.22.x', '3.24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ matrix.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: packages/flutter
        run: flutter pub get

      - name: Analyze code
        working-directory: packages/flutter
        run: flutter analyze || true

      - name: Format code
        working-directory: packages/flutter
        run: dart format .

      - name: Run tests
        working-directory: packages/flutter
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: packages/flutter/coverage
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: packages/flutter
        run: flutter pub get

      - name: Verify package structure
        working-directory: packages/flutter
        run: |
          echo "Checking Flutter package structure..."
          ls lib/
          ls lib/src/
          ls lib/src/widgets/ | wc -l
          echo "Total widget files: $(ls lib/src/widgets/*.dart | wc -l)"
