name: Web CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'packages/web/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/web/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify dist files
        run: |
          echo "Checking web package dist files..."
          ls -la packages/web/dist/
          test -f packages/web/dist/cronixui.css
          test -f packages/web/dist/cronixui.js
          test -f packages/web/dist/cronixui.min.css
          test -f packages/web/dist/cronixui.min.js
          echo "All web dist files present!"

      - name: Verify CSS loads correctly
        run: |
          node -e "
          const fs = require('fs');
          const css = fs.readFileSync('packages/web/dist/cronixui.css', 'utf8');
          console.log('CSS size:', css.length, 'bytes');
          if (css.length < 1000) {
            console.error('CSS file seems too small');
            process.exit(1);
          }
          console.log('CSS verified!');
          "

      - name: Verify JS loads correctly
        run: |
          node -e "
          const fs = require('fs');
          const js = fs.readFileSync('packages/web/dist/cronixui.js', 'utf8');
          console.log('JS size:', js.length, 'bytes');
          if (js.length < 1000) {
            console.error('JS file seems too small');
            process.exit(1);
          }
          console.log('JS verified!');
          "

      - name: Serve demo page
        run: |
          cd packages/web/demo
          python3 -m http.server 8080 &
          sleep 2
          curl -s http://localhost:8080/ | head -20
          echo "Demo page accessible!"
