name: Deploy to Develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  python-ci:
    uses: ./.github/workflows/python-ci.yml
    secrets: inherit

  react-ci:
    uses: ./.github/workflows/react-ci.yml
    secrets: inherit

  flutter-ci:
    uses: ./.github/workflows/flutter-ci.yml
    secrets: inherit

  go-ci:
    uses: ./.github/workflows/go-ci.yml
    secrets: inherit

  rust-ci:
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  web-ci:
    uses: ./.github/workflows/web-ci.yml
    secrets: inherit

  solid-ci:
    uses: ./.github/workflows/solid-ci.yml
    secrets: inherit

  svelte-ci:
    uses: ./.github/workflows/svelte-ci.yml
    secrets: inherit

  vue-ci:
    uses: ./.github/workflows/vue-ci.yml
    secrets: inherit

  typescript-ci:
    uses: ./.github/workflows/typescript-ci.yml
    secrets: inherit

  win-ci:
    uses: ./.github/workflows/win-ci.yml
    secrets: inherit

  create-pr:
    runs-on: ubuntu-latest
    needs: [
      python-ci,
      react-ci,
      flutter-ci,
      go-ci,
      rust-ci,
      web-ci,
      solid-ci,
      svelte-ci,
      vue-ci,
      typescript-ci,
      win-ci
    ]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Create PR from develop to main
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const base = "main";
              const head = `${owner}:develop`;

              const existing = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head,
                base,
                per_page: 1
              });

              if (existing.data.length > 0) {
                core.info(`Open PR already exists: #${existing.data[0].number}`);
                return;
              }

              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: "Deploy develop to main",
                head: "develop",
                base,
                body: [
                  "🚀 Ready for deployment to main!",
                  "",
                  "All CI checks have passed on develop branch:",
                  "- ✅ Python tests and linting",
                  "- ✅ React tests and build", 
                  "- ✅ Flutter tests and builds",
                  "- ✅ Go tests and linting",
                  "- ✅ Rust tests and linting",
                  "- ✅ Web tests and build",
                  "- ✅ SolidJS linting",
                  "- ✅ Svelte-Check validation",
                  "- ✅ Vue linting",
                  "- ✅ TypeScript compilation",
                  "- ✅ Windows WinUI 3 build",
                  "",
                  "Please review and merge to deploy to production."
                ].join("\n")
              });

              core.info(`Created deployment PR #${pr.data.number}`);
            } catch (error) {
              if (error.status === 403) {
                core.warning("GitHub Actions cannot create PRs yet. Enable repository setting: Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests.");
                return;
              }
              throw error;
            }
