name: Vue CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/vue/**'
      - '.github/workflows/vue-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/vue/**'
      - '.github/workflows/vue-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: cd packages/vue && npm ci || npm install
      
      - name: Verify all exports map to real files
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const indexContent = fs.readFileSync('packages/vue/src/index.js', 'utf8');
          const exports = [...indexContent.matchAll(/export\s*\{\s*default\s+as\s+(\w+)/g)].map(m => m[1]);
          console.log('Exported components:', exports.length);
          let errors = 0;
          for (const name of exports) {
            // Check direct component file
            const directFile = path.join('packages/vue/src/components', name + '.vue');
            if (fs.existsSync(directFile)) continue;
            
            // Check with Cn prefix
            const cnFile = path.join('packages/vue/src/components', 'Cn' + name + '.vue');
            if (fs.existsSync(cnFile)) continue;
            
            // Check AI subdirectory (without Cn prefix since files already have it)
            const aiFile = path.join('packages/vue/src/components/ai', name + '.vue');
            if (fs.existsSync(aiFile)) continue;
            
            // Check AI subdirectory with Cn prefix
            const aiCnFile = path.join('packages/vue/src/components/ai', 'Cn' + name + '.vue');
            if (fs.existsSync(aiCnFile)) continue;
            
            console.error('MISSING FILE:', name, '- checked components/, components/ai/');
            errors++;
          }
          if (errors > 0) {
            console.error(errors + ' exports have no matching .vue file');
            process.exit(1);
          }
          console.log('All exports verified against source files');
          "
      
      - name: Validate Vue SFC syntax
        run: |
          ERRORS=0
          for f in packages/vue/src/components/**/*.vue packages/vue/src/components/*.vue; do
            if [ -f "$f" ]; then
              if ! grep -q '<template>' "$f"; then
                echo "Missing <template>: $f"
                ERRORS=$((ERRORS + 1))
              fi
              if ! grep -q '<script' "$f"; then
                echo "Missing <script>: $f"
                ERRORS=$((ERRORS + 1))
              fi
              if ! grep -q '<style' "$f"; then
                echo "Missing <style>: $f"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS syntax issues"
            exit 1
          fi
          echo "All Vue files have valid SFC structure"
      
      - name: Check component API consistency
        run: |
          ERRORS=0
          # Check that interactive components have proper event handling
          for f in packages/vue/src/components/CnButton.vue packages/vue/src/components/CnInput.vue packages/vue/src/components/CnSelect.vue; do
            if [ -f "$f" ] && ! grep -q "emit\|on[A-Z]" "$f"; then
              echo "Interactive component missing events: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS API consistency issues"
            exit 1
          fi
          echo "API consistency check passed"
      
      - name: Check accessibility basics
        run: |
          ERRORS=0
          # Check Modal has aria-modal
          if [ -f "packages/vue/src/components/CnModal.vue" ]; then
            if ! grep -q "aria-modal" "packages/vue/src/components/CnModal.vue"; then
              echo "Modal missing aria-modal"
              ERRORS=$((ERRORS + 1))
            fi
          fi
          # Check Tabs has role=tablist
          if [ -f "packages/vue/src/components/CnTabs.vue" ]; then
            if ! grep -q "role" "packages/vue/src/components/CnTabs.vue"; then
              echo "Tabs missing role attribute"
              ERRORS=$((ERRORS + 1))
            fi
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS accessibility issues"
            exit 1
          fi
          echo "Accessibility check passed"
